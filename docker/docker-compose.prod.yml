services:
  user:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    container_name: user-prod
    command: >
      sh -c "poetry run alembic upgrade head &&
             poetry run python -m user --port=5052"
    depends_on:
      - db
    ports:
      - "5051:5051"
    volumes:
      - ${KEY_PATH}:${KEY_PATH}
      - ${CERT_PATH}:${CERT_PATH}
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

volumes:
  postgres_data:
