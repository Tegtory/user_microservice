services:
  user:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    container_name: user-dev
    command: >
      sh -c "poetry run alembic upgrade head &&
             poetry run python -m user --host=0.0.0.0 --port=5051"
    depends_on:
      - db
    ports:
      - "5051:5051"
    volumes:
      - /opt/certs:/opt/certs:ro
  db:
    image: postgres:16
    container_name: user-dev-db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

volumes:
  postgres_data:
