[project]
name = "user"
version = "0.1.0"
description = "User microservice for Tegtory"
authors = [
    {name = "sinortax",email = "github@sinortax.ru"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "aio-pika (==9.5.5)",
    "aiormq (==6.8.1)",
    "alembic (==1.16.4)",
    "asyncpg (==0.30.0)",
    "dishka (==1.6.0)",
    "grpcio (==1.73.1)",
    "grpcio-tools (==1.73.1)",
    "pydantic (==2.11.7)",
    "pydantic-settings (==2.10.1)",
    "sqlalchemy (==2.0.41)"
]

[tool.poetry.group.dev.dependencies]
coverage = "7.9.2"
mypy = "1.16.1"
pytest = "8.4.1"
pytest-asyncio = "1.0.0"
ruff = "0.12.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = 3.12
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_equality = true
ignore_missing_imports = true
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = 'user.auth_pb2,user.auth_pb2_grpc'
disallow_untyped_defs = false
disable_error_code="attr-defined,var-annotated"

[[tool.mypy.overrides]]
module = 'user.presentors.grpc.services.*'
disable_error_code="attr-defined,name-defined,no-untyped-call"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]

line-length = 79
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "auth_pb2.py",
    "auth_pb2_grpc.py",
    "migration"
]

select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "E",
    "T",
    "T201",
    "W",
    "B",
    "ERA",
    "ASYNC",
    "FBT",
    "A",
    "INP",
    "SIM",
    "TD",
    "C90",
    "N",
    "PL",
    "PLE",
    "PLR",
    "PLW",
    "UP",
    "FURB",
    "RUF",
]
ignore = []

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false

line-ending = "auto"

docstring-code-format = false

docstring-code-line-length = "dynamic"

[tool.coverage.run]
branch = true
omit = [
    "tests/*",
    "user/domain/interfaces/*",
]


[tool.coverage.report]
exclude_also = [
    "raise AssertionError",
    "raise NotImplementedError",
]
