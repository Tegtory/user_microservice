syntax = "proto3";

package grpc;

message Empty {}
message Nothing {}

message User {
  string id = 1;
  bool is_admin = 2;
  bool is_banned = 3;
}

message AuthUser {
  int32 telegram_id = 1;
  string username = 2;
}

service AuthService {
  rpc register_telegram(AuthUser) returns (Empty);
  rpc login_telegram(AuthUser) returns (User);
}

service ProfileService {

}
