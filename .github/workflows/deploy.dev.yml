name: Deploy
on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          path: "dev"
      - run: |
          docker compose -f dev/docker/docker-compose.dev.yml down
          docker compose -f dev/docker/docker-compose.dev.yml --env-file .env up -d --build